# /etc/nginx/conf.d/latin.conf  — public endpoint for latin-morph
# Replace latin.example.com with the real subdomain (Route53 A/ALIAS record → this host or the ALB).
# TLS: sudo certbot --nginx -d latin.example.com   (or terminate TLS on the ALB and keep port 80 here)
server {
    listen 80;
    server_name latin.example.com;

    client_max_body_size 64k;
    gzip on;
    gzip_types application/json text/markdown text/plain text/html;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;              # MCP streamable HTTP
        proxy_read_timeout 60s;
    }
}
