# latin-morph on diodorus-1 (alongside n8n / Evolution API).
# Usage (on the EC2 host):  docker compose -f deploy/docker-compose.yml up -d --build
services:
  latin-morph:
    build: ..
    image: latin-morph:1.0.0
    container_name: latin-morph
    restart: unless-stopped
    environment:
      RATE_LIMIT_PER_MIN: "120"
    ports:
      - "127.0.0.1:8010:8000"      # nginx on the host proxies to this
    mem_limit: 768m
    # If n8n runs in docker on the same host, join its network so n8n can call
    # http://latin-morph:8000 directly. Uncomment and set the network name:
    # networks: [n8n_default]
# networks:
#   n8n_default:
#     external: true
